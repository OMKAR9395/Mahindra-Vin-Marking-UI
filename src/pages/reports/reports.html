<div class="reports-page">
  <app-table-convert-loader
    *ngIf="isReportLoaderVisible"
    [mainMessage]="reportLoaderMainMessage"
    [subMessage]="reportLoaderSubMessage"
  />

  <mat-card class="hero">
    <div class="report-controls">
      <fieldset class="report-panel report-type-panel">
        <legend>Select Report :</legend>
        <label>
          <input
            type="radio"
            name="reportType"
            value="production"
            [checked]="selectedReportType === 'production'"
            (change)="onReportTypeChange('production')"
          />
          <span>Production Report</span>
        </label>
        <label>
          <input
            type="radio"
            name="reportType"
            value="dashboard"
            [checked]="selectedReportType === 'dashboard'"
            (change)="onReportTypeChange('dashboard')"
          />
          <span>Dashboard Report</span>
        </label>
        <label>
          <input
            type="radio"
            name="reportType"
            value="vin"
            [checked]="selectedReportType === 'vin'"
            (change)="onReportTypeChange('vin')"
          />
          <span>VIN Report</span>
        </label>
        <label>
          <input
            type="radio"
            name="reportType"
            value="vinSearch"
            [checked]="selectedReportType === 'vinSearch'"
            (change)="onReportTypeChange('vinSearch')"
          />
          <span>VIN Search Details</span>
        </label>
      </fieldset>

      <fieldset class="report-panel date-panel">
        <legend>Date Shift Filter:</legend>
        <div class="date-row">
          <span>From</span>
          <input type="date" [value]="fromDate" (change)="onFromDateChange($any($event.target).value)" />
        </div>
        <div class="date-row">
          <span>To</span>
          <input type="date" [value]="toDate" (change)="onToDateChange($any($event.target).value)" />
        </div>
        <div class="shift-options" aria-label="Shift filter">
          <label>
            <input type="radio" name="shift" [checked]="selectedShift === 'all'" (change)="onShiftChange('all')" />
            <span>ALL</span>
          </label>
          <label>
            <input type="radio" name="shift" [checked]="selectedShift === 'A'" (change)="onShiftChange('A')" />
            <span>A</span>
          </label>
          <label>
            <input type="radio" name="shift" [checked]="selectedShift === 'B'" (change)="onShiftChange('B')" />
            <span>B</span>
          </label>
          <label>
            <input type="radio" name="shift" [checked]="selectedShift === 'C'" (change)="onShiftChange('C')" />
            <span>C</span>
          </label>
        </div>
        <div class="vin-row">
          <span>Enter Last 8 Digit of VIN NO</span>
          <input type="text" maxlength="8" [value]="vinLast8" (input)="onVinLast8Change($any($event.target).value)" />
        </div>
      </fieldset>

      <fieldset class="report-panel dashboard-panel">
        <legend>Dashboard Report Filters:</legend>
        <label class="select-row">
          <span>FY Year</span>
          <select [value]="selectedFyYear" (change)="onFyYearChange($any($event.target).value)">
            <option *ngFor="let year of fyYears" [value]="year">{{ year }}</option>
          </select>
        </label>
        <label class="select-row">
          <span>Month</span>
          <select [value]="selectedMonth" (change)="onMonthChange($any($event.target).value)">
            <option *ngFor="let month of months" [value]="month">{{ month }}</option>
          </select>
        </label>
      </fieldset>

      <div class="report-button-group">
        <button class="report-action" type="button" (click)="previewReport()" [disabled]="loading">
          PreView<br />Report
        </button>
        <button class="report-action" type="button" (click)="generateReport()" [disabled]="loading">
          Generate<br />Report
        </button>
      </div>
    </div>
  </mat-card>

  <mat-card class="table-card" *ngIf="hasPreviewedReport">
    <div class="table-wrap" *ngIf="filteredRecords.length; else emptyState">
      <table mat-table [dataSource]="filteredRecords" class="report-table">
        <ng-container matColumnDef="rowIndicator">
          <th mat-header-cell *matHeaderCellDef class="row-indicator"></th>
          <td mat-cell *matCellDef="let row" class="row-indicator"></td>
        </ng-container>

        <ng-container *ngFor="let column of displayedColumns; trackBy: trackByColumn" [matColumnDef]="column">
          <th mat-header-cell *matHeaderCellDef [ngClass]="'col-' + column">
            {{ headerLabel(column) }}
          </th>
          <td mat-cell *matCellDef="let row" [ngClass]="'col-' + column">
            <span class="cell-text" [title]="displayCell(column, row)">{{ displayCell(column, row) }}</span>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="tableColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: tableColumns; trackBy: trackBySequenceId"></tr>
      </table>
    </div>

    <ng-template #emptyState>
      <div class="empty-state">No production report data available for the selected filters.</div>
    </ng-template>
  </mat-card>
</div>
