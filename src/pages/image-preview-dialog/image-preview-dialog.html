<div class="dialog-container">
  <h2 mat-dialog-title class="dialog-title">Vehicle Image Preview</h2>

  <div class="image-wrap">
    <img [src]="getImageUrl()" alt="Vehicle" class="preview-image">
  </div>

  <div class="dialog-actions">
    <button class="dialog-btn dialog-btn-ok" (click)="onOk()">
      OK
    </button>
    <button class="dialog-btn dialog-btn-cancel" (click)="onCancel()">
      Cancel
    </button>
  </div>
</div>
