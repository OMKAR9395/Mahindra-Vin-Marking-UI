<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MahindraVinMarking</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0057D9">
  <script>
    (function () {
      var isDashboardWindow = window.location.pathname.indexOf('/dashboard-window') === 0;

      var icon = document.createElement('link');
      icon.rel = 'icon';
      icon.type = 'image/png';
      icon.href = isDashboardWindow ? 'icons/dashboard-icon.png' : 'icons/icon-192x192-blue.png';
      document.head.appendChild(icon);

      var ua = navigator.userAgent.toLowerCase();
      var isMobileUa =
        /android|iphone|ipad|ipod|windows phone|mobile|blackberry|opera mini/i.test(ua);
      var isNarrowScreen = window.innerWidth < 1024;
      var isDesktop = !(isMobileUa || isNarrowScreen);
      if (!isDesktop) return;

      var manifest = document.createElement('link');
      manifest.rel = 'manifest';
      manifest.href = isDashboardWindow ? 'dashboard-manifest.webmanifest' : 'manifest.webmanifest';
      document.head.appendChild(manifest);

      var appleTouch = document.createElement('link');
      appleTouch.rel = 'apple-touch-icon';
      appleTouch.href = isDashboardWindow ? 'icons/dashboard-icon.png' : 'icons/apple-touch-icon-blue.png';
      document.head.appendChild(appleTouch);

      var mobileCapable = document.createElement('meta');
      mobileCapable.name = 'mobile-web-app-capable';
      mobileCapable.content = 'yes';
      document.head.appendChild(mobileCapable);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
